<style>
  .upcoming-post-hidden {
    display: none !important;
  }
  .upcoming-badge {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 0.15em 0.55em;
    border-radius: 0.35rem;
    background-color: #f59e0b;
    color: #111827;
    vertical-align: middle;
    margin-left: 0.4rem;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
</style>
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var activeParamKey = null;
    var activeParamVal = null;

    ['upcoming', 'preview', 'future'].forEach(function (key) {
      if (!activeParamKey && params.has(key)) {
        var val = (params.get(key) || '').toLowerCase();
        if (val !== 'false' && val !== '0' && val !== 'no') {
          activeParamKey = key;
          activeParamVal = params.get(key) || 'true';
        }
      }
    });

    var showUpcoming = Boolean(activeParamKey);
    var nowSec = Math.floor(Date.now() / 1000);

    function getItemTimestamp(el) {
      var cachedTs = el.getAttribute('data-post-ts');
      if (cachedTs) return parseInt(cachedTs, 10);
      var directTs = el.getAttribute('data-ts');
      if (directTs) {
        el.setAttribute('data-post-ts', directTs);
        return parseInt(directTs, 10);
      }
      var timeEl = el.querySelector('[data-post-ts], [data-ts]');
      if (timeEl) {
        var ts = timeEl.getAttribute('data-post-ts') || timeEl.getAttribute('data-ts');
        if (ts) {
          timeEl.setAttribute('data-post-ts', ts);
          el.setAttribute('data-post-ts', ts);
          return parseInt(ts, 10);
        }
      }
      return NaN;
    }

    function addUpcomingBadge(container) {
      if (container.querySelector('.upcoming-badge')) return;
      var timeEl = container.querySelector(
        'time[data-post-ts], time[data-ts], span.date.month[data-post-ts], span.date.month[data-ts]'
      );
      if (timeEl && timeEl.parentNode) {
        var badge = document.createElement('span');
        badge.className = 'upcoming-badge';
        badge.textContent = 'Upcoming';
        timeEl.insertAdjacentElement('afterend', badge);
      }
    }

    function processUpcomingPosts() {
      nowSec = Math.floor(Date.now() / 1000);

      var selectors = [
        '#post-list > article.card-wrapper',
        '#archives li',
        '#page-category ul.content > li',
        '#page-tag ul.content > li',
        '#related-posts article.col'
      ];

      document.querySelectorAll(selectors.join(', ')).forEach(function (item) {
        var ts = getItemTimestamp(item);
        if (!isNaN(ts) && ts > nowSec) {
          if (showUpcoming) {
            item.classList.remove('upcoming-post-hidden');
            addUpcomingBadge(item);
          } else {
            item.classList.add('upcoming-post-hidden');
          }
        }
      });

      var lastmodItems = document.querySelectorAll('#access-lastmod ul.content > li');
      if (lastmodItems.length > 0) {
        var visibleCount = 0;
        lastmodItems.forEach(function (li) {
          var ts = getItemTimestamp(li);
          var isFuture = !isNaN(ts) && ts > nowSec;
          if ((isFuture && !showUpcoming) || visibleCount >= 5) {
            li.classList.add('upcoming-post-hidden');
          } else {
            li.classList.remove('upcoming-post-hidden');
            visibleCount++;
          }
        });
      }

      var postHeaderMeta = document.querySelector('article header .post-meta');
      if (postHeaderMeta) {
        var headerTime = postHeaderMeta.querySelector('time[data-post-ts], time[data-ts]');
        if (headerTime) {
          var rawTs = headerTime.getAttribute('data-post-ts') || headerTime.getAttribute('data-ts');
          if (rawTs) {
            headerTime.setAttribute('data-post-ts', rawTs);
            var postTs = parseInt(rawTs, 10);
            if (!isNaN(postTs) && postTs > nowSec) {
              addUpcomingBadge(postHeaderMeta);
            }
          }
        }
      }

      document.querySelectorAll('.post-navigation a[data-post-ts]').forEach(function (navLink) {
        var ts = parseInt(navLink.getAttribute('data-post-ts'), 10);
        if (!isNaN(ts) && ts > nowSec && !showUpcoming) {
          var disabledDiv = document.createElement('div');
          disabledDiv.className = 'btn btn-outline-primary disabled';
          disabledDiv.setAttribute('aria-label', navLink.getAttribute('aria-label') || '');
          disabledDiv.innerHTML = '<p>-</p>';
          navLink.replaceWith(disabledDiv);
        }
      });

      document.querySelectorAll('#archives ul.list-unstyled').forEach(function (ul) {
        var visibleLis = ul.querySelectorAll('li:not(.upcoming-post-hidden)');
        var yearHeader = ul.previousElementSibling;
        if (visibleLis.length === 0) {
          ul.classList.add('upcoming-post-hidden');
          if (yearHeader && yearHeader.classList.contains('year')) {
            yearHeader.classList.add('upcoming-post-hidden');
          }
        } else {
          ul.classList.remove('upcoming-post-hidden');
          if (yearHeader && yearHeader.classList.contains('year')) {
            yearHeader.classList.remove('upcoming-post-hidden');
          }
        }
      });

      ['#page-category', '#page-tag'].forEach(function (pageSel) {
        var container = document.querySelector(pageSel);
        if (container) {
          var countEl = container.querySelector('h1 span.lead');
          var visibleItems = container.querySelectorAll('ul.content > li:not(.upcoming-post-hidden)');
          if (countEl) {
            countEl.textContent = String(visibleItems.length);
          }
        }
      });

      if (showUpcoming && activeParamKey) {
        document.querySelectorAll('a[href]').forEach(function (a) {
          var href = a.getAttribute('href');
          if (!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('javascript:')) return;
          try {
            var url = new URL(href, window.location.origin);
            if (url.origin === window.location.origin && !url.searchParams.has(activeParamKey)) {
              url.searchParams.set(activeParamKey, activeParamVal);
              a.setAttribute('href', url.pathname + url.search + url.hash);
            }
          } catch (e) {}
        });
      }
    }

    var observer = new MutationObserver(function () {
      processUpcomingPosts();
    });
    observer.observe(document.documentElement, { childList: true, subtree: true });

    document.addEventListener('DOMContentLoaded', function () {
      observer.disconnect();
      processUpcomingPosts();
    });
  })();
</script>
