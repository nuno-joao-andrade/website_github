<!-- Cookie Consent & Google Analytics (GA4 with Consent Mode v2) -->
<style>
  #cookie-consent-banner {
    position: fixed;
    bottom: 1.25rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1050;
    width: calc(100% - 2rem);
    max-width: 38rem;
    padding: 1rem 1.25rem;
    border-radius: 0.75rem;
    background-color: var(--card-bg, #ffffff);
    color: var(--text-color, #34343c);
    border: 1px solid var(--btn-border-color, #e9ecef);
    box-shadow: var(--card-shadow, 0 6px 18px rgba(0, 0, 0, 0.15));
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
    font-size: 0.9rem;
    line-height: 1.45;
    animation: cookie-banner-slide-up 0.3s ease-out;
  }

  @media (min-width: 576px) {
    #cookie-consent-banner {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
    }
  }

  @keyframes cookie-banner-slide-up {
    from {
      opacity: 0;
      transform: translate(-50%, 1rem);
    }
    to {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  }

  #cookie-consent-banner .cookie-consent-text {
    margin: 0;
    color: var(--text-color, #34343c);
  }

  #cookie-consent-banner .cookie-consent-text i {
    color: var(--link-color, #0056b2);
    margin-right: 0.4rem;
  }

  #cookie-consent-banner .cookie-consent-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 0.5rem;
    flex-shrink: 0;
  }

  #cookie-consent-banner .cookie-btn {
    padding: 0.375rem 0.85rem;
    border-radius: 0.4rem;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
    border: 1px solid var(--btn-border-color, #e9ecef);
  }

  #cookie-consent-banner .cookie-btn-decline {
    background-color: var(--button-bg, transparent);
    color: var(--text-muted-color, #757575);
  }

  #cookie-consent-banner .cookie-btn-decline:hover {
    color: var(--text-color, #34343c);
    border-color: var(--text-muted-color, #757575);
  }

  #cookie-consent-banner .cookie-btn-accept {
    background-color: var(--link-color, #0056b2);
    color: var(--main-bg, #ffffff);
    border-color: var(--link-color, #0056b2);
  }

  #cookie-consent-banner .cookie-btn-accept:hover {
    opacity: 0.9;
  }
</style>

<script>
  (function () {
    var STORAGE_KEY = 'cookie-consent';
    var GA_ID = '{{ site.google_analytics.id }}';
    var IS_PROD = '{{ jekyll.environment }}' === 'production';
    var gaLoaded = false;

    window.dataLayer = window.dataLayer || [];
    function gtag() {
      window.dataLayer.push(arguments);
    }
    window.gtag = gtag;

    /* Default Google Consent Mode v2 state (denied until explicit opt-in) */
    gtag('consent', 'default', {
      analytics_storage: 'denied',
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied'
    });

    function loadGoogleAnalytics() {
      if (gaLoaded || !GA_ID || !IS_PROD) return;
      gaLoaded = true;

      gtag('consent', 'update', {
        analytics_storage: 'granted'
      });

      var script = document.createElement('script');
      script.async = true;
      script.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(GA_ID);
      document.head.appendChild(script);

      gtag('js', new Date());
      gtag('config', GA_ID);
    }

    function clearGoogleAnalyticsCookies() {
      var cookies = document.cookie.split(';');
      var domainParts = window.location.hostname.split('.');
      var rootDomain = domainParts.length > 1 ? '.' + domainParts.slice(-2).join('.') : window.location.hostname;

      for (var i = 0; i < cookies.length; i++) {
        var name = cookies[i].split('=')[0].trim();
        if (name === '_ga' || name.indexOf('_ga_') === 0 || name === '_gid' || name === '_gat') {
          document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
          document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; domain=' + rootDomain;
        }
      }
    }

    function removeBanner() {
      var existing = document.getElementById('cookie-consent-banner');
      if (existing) {
        existing.remove();
      }
    }

    function showBanner() {
      if (document.getElementById('cookie-consent-banner')) return;

      var banner = document.createElement('aside');
      banner.id = 'cookie-consent-banner';
      banner.setAttribute('role', 'dialog');
      banner.setAttribute('aria-label', 'Cookie consent');
      banner.innerHTML =
        '<p class="cookie-consent-text">' +
          '<i class="fas fa-cookie-bite" aria-hidden="true"></i>' +
          'This blog uses cookies from Google Analytics to analyze traffic and improve your experience.' +
        '</p>' +
        '<div class="cookie-consent-actions">' +
          '<button type="button" class="cookie-btn cookie-btn-decline" id="cookie-consent-decline">Decline</button>' +
          '<button type="button" class="cookie-btn cookie-btn-accept" id="cookie-consent-accept">Accept</button>' +
        '</div>';

      document.body.appendChild(banner);

      document.getElementById('cookie-consent-accept').addEventListener('click', function () {
        try {
          localStorage.setItem(STORAGE_KEY, 'accepted');
        } catch (e) {}
        loadGoogleAnalytics();
        removeBanner();
      });

      document.getElementById('cookie-consent-decline').addEventListener('click', function () {
        try {
          localStorage.setItem(STORAGE_KEY, 'rejected');
        } catch (e) {}
        gtag('consent', 'update', {
          analytics_storage: 'denied'
        });
        clearGoogleAnalyticsCookies();
        removeBanner();
      });
    }

    var consent = null;
    try {
      consent = localStorage.getItem(STORAGE_KEY);
    } catch (e) {}

    if (consent === 'accepted') {
      loadGoogleAnalytics();
    } else if (consent !== 'rejected') {
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', showBanner);
      } else {
        showBanner();
      }
    }

    /* Allow reopening the cookie dialog if needed */
    window.openCookieConsent = function () {
      showBanner();
    };
  })();
</script>
